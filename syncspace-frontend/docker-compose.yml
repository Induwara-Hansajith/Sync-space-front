version: '3.8'

services:
  syncspace-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncspace-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:8080
      - VITE_WS_URL=http://localhost:8080/ws-chat
    restart: unless-stopped
